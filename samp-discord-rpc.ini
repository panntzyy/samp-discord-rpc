; ========================================================
; SA:MP Discord Rich Presence - Configuration File
; Place this file in the same folder as the .asi or in GTA root
; ========================================================

[Discord]
; Interval refresh status ke Discord (dalam detik, minimal 3)
UpdateInterval = 10

; URL database server config (logo & website, otomatis fetch dari GitHub repo)
CustomLogosURL = https://raw.githubusercontent.com/panntzyy/samp-discord-rpc/main/server-config.txt

[Presence]
; Template teks baris atas (Details) & baris bawah (State)
; Variabel yang didukung:
;   %hostname%   - Nama server SA:MP
;   %ip%         - IP server
;   %port%       - Port server
;   %nickname%   - Nickname player kamu
;   %players%    - Jumlah player yang sedang online
;   %maxplayers% - Kapasitas maksimal player server
;   %gamemode%   - Gamemode yang sedang berjalan
;   %mapname%    - Nama map server
Details = %hostname%
State = %ip%:%port%

; Menampilkan durasi bermain (1 = Aktif, 0 = Nonaktif)
ShowTimestamp = 1

; Gambar Besar Default (Dipakai jika server tidak ada di server-config.txt)
LargeImageKey = logo
LargeImageText = %players%/%maxplayers% players online

; Gambar Kecil (Small Image) - Icon info player
SmallImageKey = info
SmallImageText = Playing as %nickname%
